<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./styles/blog.css" rel="stylesheet">
    <title>Final version</title>
</head>

<body>
    <main>
        <h1 class="visually-hidden">Blog of Mila Massaro</h1>

        <section class="container-dashboard">
            <!-- TOP AXIS -->
            <fieldset class="top-bar">
                <legend>Primary topic</legend>

                <input type="radio" name="primary" value="work" id="my-work1" checked>
                <label for="my-work1" aria-label="Work">W</label>

                <input type="radio" name="primary" value="goals" id="my-goals1">
                <label for="my-goals1" aria-label="Goals">G</label>

                <input type="radio" name="primary" value="nerds" id="weekly-nerds1">
                <label for="weekly-nerds1" aria-label="Guestspeakers">N</label>

                <input type="radio" name="primary" value="reflection" id="reflection1">
                <label for="reflection1" aria-label="Reflections">R</label>
            </fieldset>

            <!-- SIDE AXIS -->
            <fieldset class="side-bar">
                <legend>Secondary topic</legend>

                <input type="radio" name="secondary" value="work" id="my-work2" checked>
                <label for="my-work2" aria-label="Work">W</label>

                <input type="radio" name="secondary" value="goals" id="my-goals2">
                <label for="my-goals2" aria-label="Goals">G</label>

                <input type="radio" name="secondary" value="nerds" id="weekly-nerds2">
                <label for="weekly-nerds2" aria-label="Guestspeakers">N</label>

                <input type="radio" name="secondary" value="reflection" id="reflection2">
                <label for="reflection2" aria-label="Reflections">R</label>
            </fieldset>

            <!-- CONTENT -->
            <section class="content">

                <!-- WORK x WORK -->
                <section class="container-content workxwork">
                    <div class="card card-work">
                        <div class="text">
                            <h2>Hallo</h2>
                            <p>Glass effect met lagen</p>
                        </div>
                    </div>

                    <div class="card card-goal">
                        <div class="text">
                            <h2>Hallo</h2>
                            <p>Goalsss</p>
                        </div>
                    </div>
                </section>

                <!-- WORK x GOALS -->
                <section class="workxgoals">
                    <h2>work x goals</h2>
                </section>

                <!-- WORK x NERDS -->
                <section class="workxnerds">
                    <h2>work x nerds</h2>
                </section>

                <!-- WORK x REFLECTION -->
                <section class="workxreflection">
                    <h2>work x reflection</h2>
                </section>

                <!-- GOALS x GOALS -->
                <section class="goalsxgoals">
                    <h2>goals x goals</h2>
                </section>

                <!-- GOALS x NERDS -->
                <section class="goalsxnerds">
                    <h2>goals x nerds</h2>
                </section>

                <!-- GOALS x REFLECTION -->
                <section class="goalsxreflection">
                    <h2>goals x reflection</h2>
                </section>

                <!-- NERDS x NERDS -->
                <section class="nerdsxnerds">
                    <h2>nerds x nerds</h2>
                </section>

                <!-- NERDS x REFLECTION -->
                <section class="nerdsxreflection">
                    <h2>nerds x reflection</h2>
                </section>

                <!-- REFLECTION x REFLECTION -->
                <section class="reflectionxreflection">
                    <h2>reflection x reflection</h2>
                </section>
            </section>
        </section>
    </main>
</body>

</html>
